# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# @schema
# type: [string, null]
# @schema
#  Name of an existing ServiceAccount to run the pods under.
serviceAccountName:
# -- Number of replicas. Ignored when `hpa.enabled` is true.
replicaCount: 1

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  metrics: []

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1
  # @schema
  # additionalProperties: true
  # @schema
  annotations: {}

image:
  registry: ghcr.io
  repository: opendatacube/explorer
  tag: ""  # Defaults to the chart appVersion when left empty
  pullPolicy: IfNotPresent

database:
  database: datacube
  host: localhost
  port: 5432
  existingSecret: "explorer-reader"
  adminExistingSecret: "explorer-admin"  # Secret used for schema migration hooks (needs write/DDL privileges)

resources:
  limits:
    cpu: "300m"
    memory: 1024Mi

# @schema
# additionalProperties: true
# @schema
annotations: {}

# @schema
# additionalProperties: true
# @schema
livenessProbe: {}
# httpGet:
#   path: "/stac"
#   port: 8080
# initialDelaySeconds: 10
# periodSeconds: 30
# timeoutSeconds: 60
# failureThreshold: 5

# @schema
# additionalProperties: true
# @schema
readinessProbe: {}
# httpGet:
#   path: "/stac"
#   port: 8080
# initialDelaySeconds: 10
# periodSeconds: 30
# timeoutSeconds: 60
# failureThreshold: 5

# @schema
# additionalProperties: true
# @schema
startupProbe: {}
# httpGet:
#   path: "/stac"
#   port: 8080
# initialDelaySeconds: 10
# periodSeconds: 30
# timeoutSeconds: 60
# failureThreshold: 5

# @schema
# additionalProperties: true
# @schema
additionalEnvironmentVars: {}

service:
  type: ClusterIP

externalPort: 80  # External port on which service listen to
internalPort: 8080  # Internal port on which pod is running and serving cubedash app

dockerArgs:
  - "gunicorn"
  - "-b"
  - "0.0.0.0:8080"
  - "-w"
  - "3"
  - "--threads=2"
  - "-k"
  - "gthread"
  - "-t"
  - "60"
  - "--pid"
  - "gunicorn.pid"
  - "--worker-tmp-dir"
  - "/dev/shm"
  - "--preload"
  - "--config"
  - "python:cubedash.gunicorn_config"
  - "cubedash:app"
  - "||"
  - "true"

# Run `cubedash-gen --init` as a Helm hook on install/upgrade to
# initialise or migrate the ODC Explorer database.
# This requires an existing database role with permission to write to the cubedash
# schema. Point at a different secret with `database.adminExistingSecret`.
initSchema:
  enabled: true
  epsg: 6933  # EPSG code used to initialise the cubedash summary schema
  backoffLimit: 0  # Number of retries

updateCreationDt:
  enabled: false
  historyLimit: 1
  concurrencyPolicy: Allow  # concurrent executions of a job
  cron: "0 13 * * *"  ## Run daily at 11 pm AEST
  suspend: false
  backoffLimit: 0  # Number of retries
  dockerArgs:
  - "cubedash-gen"
  - "--no-init-database"
  - "--refresh-stats"
  - "--force-refresh"
  - "--all"

# @schema
# additionalProperties: true
# @schema
additionalSettings: {}

# @schema
# additionalProperties: true
# @schema
affinity: {}

ingress:
  enabled: false
  path: "/"
  # -- Ingress path type. One of Prefix, Exact or ImplementationSpecific.
  pathType: Prefix
  # -- Name of the IngressClass to use. Left empty the cluster default applies.
  ingressClassName: ""
  hosts:
    - ""
  # @schema
  # additionalProperties: true
  # @schema
  annotations: {}
