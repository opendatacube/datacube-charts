{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ template "datacube-explorer.fullname" . }}
  labels:
    helm.sh/chart: {{ include "datacube-explorer.chart" . }}
    app.kubernetes.io/name: {{ include "datacube-explorer.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.image.tag | default .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "datacube-explorer.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
{{- with .Values.hpa.metrics }}
  metrics:
{{ toYaml . | indent 8 }}
{{- end }}
{{- end }}
