# Default values for datacube-wms.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
minReplicas: 1
maxReplicas: 2
# serviceAccount -- See configuration below
# @schema
# properties:
#   enabled:
#     title: enabled
#     type: boolean
#     description: Whether to create and use a Service Account
#   name:
#     title: name
#     type: string
#   annotations:
#     title: annotations
#     type: object
# @schema
serviceAccount: {}
# If using IRSA the service account can be configured by replacing the ${...} variables with your deployments values
# serviceAccount:
#   enabled: True
#   name: ${service_account_name}
#   annotations:
#     eks.amazonaws.com/role-arn: ${service_account_role_arn}
# securityContext:
#   fsGroup: 65534 # For datacube-ows to read Kubernetes and AWS token files


clusterInfo:
  envName: dev
database:
  # @schema
  # type: [string, null]
  # @schema
  # Name of an existing Secret holding `postgres-username` / `postgres-password`.
  existingSecret:
  database: datacube
  host: localhost
  port: 5432


##
## Datacube OWS configuration
##
ows:
  image:
    registry: ghcr.io
    repository: opendatacube/ows
    tag: latest
    pullPolicy: Always
  enabled: true
  maxSurge: 25%
  maxUnavailable: 25%
  externalPort: 80
  internalPort: 8000
  resources:
    limits:
      cpu: "1"
      memory: 2048Mi
  dockerArgs: ["gunicorn", "-b", "0.0.0.0:8000", "-w", "4", "--keep-alive", "50", "--timeout", "120", "datacube_ows.wsgi"]
  # @schema
  # type: object
  # default: {"iam.amazonaws.com/role": "kubernetes-wms"}
  # additionalProperties: true
  # @schema
  # Extra annotations to apply to the OWS Pods
  annotations: {}
  # @schema
  # additionalProperties: true
  # @schema
  livenessProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  readinessProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  startupProbe: {}
  # Deployment level security context
  # @schema
  # additionalProperties: true
  # @schema
  securityContext: {}
  hpa:
    autoscaling: true
    # HorizontalPodAutoscaler metrics.
    metrics: []
owsConfig:
  image:
    registry: ghcr.io
    repository: opendatacube/ows
    tag: latest
    pullPolicy: Always
    # The folder location within the running Pod which contains the
    # ows config file
    cfg_folder: "/code/integration_tests/cfg"
  # securityContext -- Container level security context
  securityContext: {}
  path: "/env/config"
  # the OWS config Python Object
  ows_cfg: "cfg.ows_test_cfg.ows_cfg"

pyspy:
  # @schema
  # additionalProperties: true
  # @schema
  image: {}
  resources:
    limits:
      cpu: "0.125"
      memory: 512Mi
##
## Prometheus Monitoring
##
prometheus:
  enabled: false
  path: "/opt/prometheus/"

##
## cProfiling, only enable for debugging and profiling purposes
##
profiling:
  enabled: false
  path: "/opt/profiling/"

service:
  type: NodePort

# @schema
# additionalProperties: true
# @schema
affinity: {}

# @schema
# additionalProperties: true
# @schema
tolerations: {}

ingress:
  ## Enable Ingress.
  ##
  enabled: false
  hosts:
    - ""
  path: "/"
  redirect: false
  # @schema
  # additionalProperties: true
  # @schema
  annotations: {}
