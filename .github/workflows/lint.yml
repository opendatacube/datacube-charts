name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only keep the newest run for a given PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run helm-docs
        # Installs helm-docs and fails if the committed docs are out of date.
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          fail-on-diff: true
          skip-version-footer: true

  kubeconform-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for now because this script does a comparison against the
          # 'main' branch to know which charts to test.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install helm kubeconform plugin
        run: helm plugin install https://github.com/jtyr/kubeconform-helm --verify=false

      - name: Run kubeconform against charts
        run: |
          for chartdir in stable/*; do
            echo "Running helm-kubeconform on ${chartdir}"
            helm kubeconform --verbose --summary "${chartdir}"
          done

  chart-testing:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
      changed_list: ${{ steps.list-changed.outputs.changed_list }}

    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          changed_list=$(echo "$changed" | jq -Rn --compact-output '[inputs]')
          echo "changed=${changed}"
          echo "changed_list=${changed_list}"
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_list=${changed_list}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing lint (Changed Charts)
        if: ${{ github.ref_name != 'main' }}
        run: ct lint --github-groups --config ct.yaml

      - name: Run chart-testing lint (All Charts)
        if: ${{ github.ref_name == 'main' }}
        run: |
          ct lint --github-groups --config ct.yaml

  install-chart:
    name: install-chart
    runs-on: ubuntu-latest
    # Disabled for now because the charts do not install correctly with their default configurations.
    if: false && needs.chart-testing.outputs.changed == 'true'
    needs:
      - lint-docs
      - kubeconform-chart
      - chart-testing
    strategy:
      matrix:
        k8s_versions:
          # https://hub.docker.com/r/kindest/node/tags
          - v1.35.8
        chart: ${{ fromJSON(needs.chart-testing.outputs.changed_list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create kind ${{ matrix.k8s_versions }} cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          config: .github/kind.yaml
          ignore_failed_clean: 'true'
          node_image: kindest/node:${{ matrix.k8s_versions }}

      - name: Install chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Test install chart ${{matrix.chart}}
        env:
          chart: "${{ matrix.chart }}"
        run: ct install --config ct.yaml --charts "$chart"
