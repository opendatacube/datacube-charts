pull_request_rules:
  - name: automatic merge when CI passes and reviewed
    conditions:
      - "#approved-reviews-by>=2"
      # Aggregate status check from .github/workflows/lint.yml
      - check-success=ci-status
      - base=main
      - label=ready-to-merge  # only auto-merge when PR with this label
    actions:
      merge:
        method: merge
