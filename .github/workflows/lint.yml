name: Lint and Test Charts

on:
  pull_request:

  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run helm-docs
        # Installs helm-docs and fails if the committed docs are out of date.
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          fail-on-diff: true

  kubeconform-chart:
    runs-on: ubuntu-latest
    needs:
      - lint-test
      - lint-docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for now because this script does a comparison against the
          # 'main' branch to know which charts to test.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install helm kubeconform plugin
        run: helm plugin install https://github.com/jtyr/kubeconform-helm --verify=false

      - name: Run kubeconform against charts
        run: |
          for chartdir in stable/*; do
            echo "Running helm-kubeconform on ${chartdir}"
            helm kubeconform --verbose --summary "${chartdir}"
          done


  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Lint Charts
        run: |
          helm lint stable/*

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed)
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi

      - name: Run chart-testing (lint)
        run: ct lint

  install-chart:
    name: install-chart
    runs-on: ubuntu-latest
    needs:
      - lint-test
      - lint-docs
      - kubeconform-chart
    strategy:
      matrix:
        k8s:
          # https://hub.docker.com/r/kindest/node/tags
          - v1.35.8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create kind ${{ matrix.k8s }} cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          node_image: kindest/node:${{ matrix.k8s }}

      - name: Run chart-testing (install)
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          command: install
