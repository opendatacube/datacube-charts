{{- if .Values.updateCreationDt.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: '{{ include "datacube-explorer.fullname" . }}-update-dt'
  labels:
    app.kubernetes.io/name: {{ include "datacube-explorer.name" . }}
    helm.sh/chart: {{ include "datacube-explorer.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/version: {{ .Values.image.tag | default .Chart.AppVersion }}
spec:
  schedule: {{ .Values.updateCreationDt.cron | quote }}
  successfulJobsHistoryLimit: {{ .Values.updateCreationDt.historyLimit }}
  concurrencyPolicy: {{ .Values.updateCreationDt.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ .Values.updateCreationDt.historyLimit }}
  suspend: {{ .Values.updateCreationDt.suspend }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.updateCreationDt.backoffLimit }}
      template:
        metadata:
          name: {{ include "datacube-explorer.name" . }}
          labels:
            app.kubernetes.io/name: {{ include "datacube-explorer.name" . }}
            helm.sh/chart: {{ include "datacube-explorer.chart" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/managed-by: {{ .Release.Service }}
            app.kubernetes.io/version: {{ .Values.image.tag | default .Chart.AppVersion }}
          annotations:
          {{- range $key, $value := .Values.annotations }}
            {{ $key }}: {{ $value | quote }}
          {{- end }}
        spec:
          containers:
          - name: explorer-update-creation-dt
            {{- if .Values.image.sha }}
            image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}@sha256:{{ .Values.image.sha }}"
            {{- else }}
            image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            {{- end }}
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            args: [ {{- range .Values.updateCreationDt.dockerArgs }} {{ . | quote }}, {{ end -}} ]
            env:
            - name: DB_HOSTNAME
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_DATABASE
              value: {{ .Values.database.database | quote }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ coalesce .Values.databaseManager.existingSecret .Values.database.existingSecret }}
                  key: {{ coalesce .Values.databaseManager.userKey .Values.database.userKey "postgres-username" }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ coalesce .Values.databaseManager.existingSecret .Values.database.existingSecret }}
                  key: {{ coalesce .Values.databaseManager.passwordKey .Values.database.passwordKey "postgres-password" }}
            {{- if .Values.additionalEnvironmentVars }}
            {{- range $arg, $value := .Values.updateCreationDt.additionalEnvironmentVars }}
            - name: {{ $arg | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          restartPolicy: Never
{{- end }}
