name: Publish charts

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# cr pushes index.yaml to gh-pages, so never let two runs overlap.
concurrency:
  group: publish-charts
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cr needs full history to diff against the previous tag, and needs
          # refs/remotes/origin/gh-pages present to build its worktree.
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@df287104677278f869ca5480bd260358397cc3f9 # v1.8.0
        with:
          # Chart sources live in stable/, not the action's default charts/.
          charts_dir: stable
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep updating the historical index location on gh-pages.
          CR_PAGES_INDEX_PATH: charts/index.yaml
          CR_GENERATE_RELEASE_NOTES: true
