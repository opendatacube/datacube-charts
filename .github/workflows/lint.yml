name: Lint and Test Charts

on:
  pull_request:

  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run helm-docs
        # Installs helm-docs and fails if the committed docs are out of date.
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          fail-on-diff: true

  kubeconform-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for now because this script does a comparison against the
          # 'main' branch to know which charts to test.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install helm kubeconform plugin
        run: helm plugin install https://github.com/jtyr/kubeconform-helm --verify=false

      - name: Run kubeconform against charts
        run: |
          for chartdir in stable/*; do
            echo "Running helm-kubeconform on ${chartdir}"
            helm kubeconform --verbose --summary "${chartdir}"
          done


  chart-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Install chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Lint Charts
        run: |
          helm lint stable/*

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed)
          changed_list=$(echo $changed | jq -Rn --compact-output '[inputs]')
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_charts=${changed_list}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --github-groups

  install-chart:
    name: install-chart
    runs-on: ubuntu-latest
    if: needs.chart-testing.outputs.changed == 'true'
    needs:
      - lint-docs
      - kubeconform-chart
      - chart-testing
    strategy:
      matrix:
        k8s_versions:
          # https://hub.docker.com/r/kindest/node/tags
          - v1.35.8
        chart: ${{ fromJSON(needs.chart-testing.outputs.changed_charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create kind ${{ matrix.k8s_versions }} cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          node_image: kindest/node:${{ matrix.k8s_versions }}

      - name: Install chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Test install chart ${{matrix.chart}}
        env:
          chart: "${{ matrix.chart }}"
        run: ct install --charts "$chart"
